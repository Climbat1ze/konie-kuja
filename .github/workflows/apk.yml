name: Buduj APK

on:
  push:
    branches: [main]
    paths: ["www/**", "ikona/**", "package.json", "capacitor.config.json", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Zależności
        run: npm install --no-audit --no-fund
      - name: Projekt Android z www/
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikona (strzykawka)
        run: cp -r ikona/res/. android/app/src/main/res/
      - name: Stały podpis i numer wersji
        run: |
          cat >> android/app/build.gradle <<EOF

          android {
              signingConfigs {
                  konie {
                      storeFile file("${GITHUB_WORKSPACE}/podpis/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              defaultConfig {
                  versionCode ${GITHUB_RUN_NUMBER}
                  versionName "0.1.${GITHUB_RUN_NUMBER}"
              }
              buildTypes {
                  debug { signingConfig signingConfigs.konie }
              }
          }
          EOF
      - name: Budowa
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../konie-kuja.apk
      - name: Kontrola podpisu (ten sam klucz w każdej wersji)
        run: |
          want=$(keytool -list -v -keystore podpis/debug.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile konie-kuja.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "oczekiwany: $want"; echo "w APK:      $got"
          test -n "$want" && test "$want" = "$got"
      - name: Wydanie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Konie Kują 0.1.${{ github.run_number }}
          make_latest: true
          files: konie-kuja.apk
          body: |
            Pobierz `konie-kuja.apk` na telefonie i otwórz plik. Android zapyta o zgodę na instalację z tego źródła: zezwól.
            Aktualizacja: zainstaluj nowy plik na stary, historia zostaje.
