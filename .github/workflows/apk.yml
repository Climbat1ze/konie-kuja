name: Buduj APK

on:
  push:
    branches: [main]
    paths: ["www/**", "ikona/**", "package.json", "capacitor.config.json", ".github/workflows/apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Zależności
        run: npm install --no-audit --no-fund
      - name: Projekt Android z www/
        run: |
          npx cap add android
          npx cap sync android
      - name: Ikona (strzykawka)
        run: cp -r ikona/res/. android/app/src/main/res/
      - name: Stały podpis (aktualizacje bez odinstalowania)
        run: |
          mkdir -p ~/.android
          cp podpis/debug.keystore ~/.android/debug.keystore
      - name: Budowa
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../konie-kuja.apk
      - name: Wydanie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Konie Kują 0.1.${{ github.run_number }}
          make_latest: true
          files: konie-kuja.apk
          body: |
            Pobierz `konie-kuja.apk` na telefonie i otwórz plik. Android zapyta o zgodę na instalację z tego źródła: zezwól.
            Aktualizacja: zainstaluj nowy plik na stary, historia zostaje.
